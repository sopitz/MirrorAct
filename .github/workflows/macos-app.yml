name: macOS app

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-app-${{ github.ref }}
  cancel-in-progress: true

env:
  HOMEBREW_NO_ANALYTICS: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  MIRRORACT_DERIVED: ${{ github.workspace }}/build/DerivedData

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install dependencies
        run: brew install xcodegen cmake pkgconf libplist openssl@3 gstreamer

      - name: Build
        run: scripts/build.sh --no-install

      - name: Test
        run: scripts/test.sh

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirroract-build-logs
          path: |
            build/DerivedData/build.log
            build/DerivedData/test.log
          if-no-files-found: ignore

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: MirrorAct-macOS
          path: build/DerivedData/Build/Products/Release/MirrorAct.app
